<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  </style>
</head>

<body>
<div id="myDiagramDiv" style="width:100%; height:100vh;"></div>
</body>

<script src="https://cdn.jsdelivr.net/npm/gojs/release/go.js"></script>

<script>
  const myDiagram =
    new go.Diagram('myDiagramDiv', {
      // allow double-click in background to create a new node
      "clickCreatingTool.archetypeNodeData": {text: "Node", color: "lightgray"},
      // allow Ctrl-G to group selected nodes
      "commandHandler.archetypeGroupData": {text: "Group", isGroup: true},
      // have mouse wheel events zoom in and out instead of scroll up and down
      "toolManager.mouseWheelBehavior": go.WheelMode.Zoom,
      "undoManager.isEnabled": true // enable undo & redo
    });

  myDiagram.layout = new go.TreeLayout({angle: 90, layerSpacing: 35});

  // the template we defined earlier
  myDiagram.nodeTemplate =
    new go.Node("Horizontal",
      {background: "#44CCFF"})
      .add(
        new go.Picture({margin: 10, width: 50, height: 50, background: "red"})
          .bind("source"),
        new go.TextBlock("Default Text",
          {margin: 12, stroke: "white", font: "bold 16px sans-serif"})
          .bind("text", "name")
      );
  myDiagram.linkTemplate =
    new go.Link(
      // default routing is go.Routing.Normal
      // default corner is 0
      {routing: go.Routing.Orthogonal, corner: 5})
      .add(
        // the link path, a Shape
        new go.Shape({strokeWidth: 3, stroke: "#555"}),
        // if we wanted an arrowhead we would also add another Shape with toArrow defined:
        //new go.Shape({  toArrow: "Standard", stroke: null  })
      );
  myDiagram.model = new go.TreeModel(
    [ // the "key" and "parent" property names are required,
      // but you can add whatever data properties you need for your app
      {key: "1", name: "Don Meow", source: "cat1.png"},
      {key: "2", parent: "1", name: "Demeter", source: "cat2.png"},
      {key: "3", parent: "1", name: "Copricat", source: "cat3.png"},
      {key: "4", parent: "3", name: "Jellylorum", source: "cat4.png"},
      {key: "5", parent: "3", name: "Alonzo", source: "cat5.png"},
      {key: "6", parent: "2", name: "Munkustrap", source: "cat6.png"}
    ]);

  const node = myDiagram.nodes.first();
  const animation = new go.Animation();
  // Animate this Node from its current position  to (400, 500)
  animation.add(node, "position", node.position, new go.Point(400, 500));
  // Animate the fill of the Shape within the Node, from its current color to blue
  // Both of these effects will animate simultaneously when start() is called:
  animation.start();
</script>
</html>
<script>
</script>
